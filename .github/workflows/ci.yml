name: Moustass CloudSec CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ─── Auth Service Spring Boot ─────────────────────────────────────────────
  auth-service:
    name: Auth Service - Build and Test
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Donner les droits a mvnw
        working-directory: backend
        run: chmod +x mvnw

      - name: Build et tests Maven
        working-directory: backend
        run: ./mvnw clean verify

      - name: Analyse SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=Nirina2108_moustass_cloudsec_final \
            -Dsonar.organization=nirina2108 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${SONAR_TOKEN}

      - name: Connexion Docker Hub
        if: ${{ env.DOCKER_USERNAME != '' }}
        uses: docker/login-action@v3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image Docker auth-service
        if: ${{ env.DOCKER_USERNAME != '' }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: docker build -t ${DOCKER_USERNAME}/moustass-auth-service:latest ./backend

      - name: Push image auth-service
        if: ${{ env.DOCKER_USERNAME != '' }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: docker push ${DOCKER_USERNAME}/moustass-auth-service:latest

  # ─── Audio Service Laravel ────────────────────────────────────────────────
  audio-service:
    name: Audio Service - Build and Test
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      - name: Installer PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, mbstring, openssl

      - name: Installer les dependances Composer
        working-directory: audio-service
        run: composer install --optimize-autoloader

      - name: Configurer environnement de test
        working-directory: audio-service
        run: |
          cp .env.example .env
          echo "APP_KEY=base64:dGVzdGtleW11c3RiZTMyY2hhcmFjdGVyc2xvbmc=" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env
          echo "AUDIO_ENCRYPTION_KEY=moustass2024audiokey!" >> .env
          echo "AUTH_SERVICE_URL=http://localhost:8000" >> .env

      - name: Generer la cle Laravel
        working-directory: audio-service
        run: php artisan key:generate

      - name: Lancer les tests
        working-directory: audio-service
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          APP_KEY: base64:dGVzdGtleW11c3RiZTMyY2hhcmFjdGVyc2xvbmc=
          AUDIO_ENCRYPTION_KEY: moustass2024audiokey!
        run: ./vendor/bin/phpunit

      - name: Connexion Docker Hub
        if: ${{ env.DOCKER_USERNAME != '' }}
        uses: docker/login-action@v3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image Docker audio-service
        if: ${{ env.DOCKER_USERNAME != '' }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: docker build -t ${DOCKER_USERNAME}/moustass-audio-service:latest ./audio-service

      - name: Push image audio-service
        if: ${{ env.DOCKER_USERNAME != '' }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: docker push ${DOCKER_USERNAME}/moustass-audio-service:latest

  # ─── Billing Service Laravel ──────────────────────────────────────────────
  billing-service:
    name: Billing Service - Build and Test
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      - name: Installer PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, mbstring, openssl

      - name: Installer les dependances Composer
        working-directory: billing-service
        run: composer install --optimize-autoloader

      - name: Configurer environnement de test
        working-directory: billing-service
        run: |
          cp .env.example .env
          echo "APP_KEY=base64:dGVzdGtleW11c3RiZTMyY2hhcmFjdGVyc2xvbmc=" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env
          echo "AUTH_SERVICE_URL=http://localhost:8000" >> .env

      - name: Generer la cle Laravel
        working-directory: billing-service
        run: php artisan key:generate

      - name: Lancer les tests
        working-directory: billing-service
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          APP_KEY: base64:dGVzdGtleW11c3RiZTMyY2hhcmFjdGVyc2xvbmc=
        run: ./vendor/bin/phpunit

      - name: Connexion Docker Hub
        if: ${{ env.DOCKER_USERNAME != '' }}
        uses: docker/login-action@v3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image Docker billing-service
        if: ${{ env.DOCKER_USERNAME != '' }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: docker build -t ${DOCKER_USERNAME}/moustass-billing-service:latest ./billing-service

      - name: Push image billing-service
        if: ${{ env.DOCKER_USERNAME != '' }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: docker push ${DOCKER_USERNAME}/moustass-billing-service:latest

  # ─── Frontend React ───────────────────────────────────────────────────────
  frontend:
    name: Frontend React - Build and Push
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout du projet
        uses: actions/checkout@v4

      - name: Installer Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances npm
        working-directory: frontend
        run: npm install

      - name: Build React
        working-directory: frontend
        run: npm run build

      - name: Connexion Docker Hub
        if: ${{ env.DOCKER_USERNAME != '' }}
        uses: docker/login-action@v3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image Docker frontend
        if: ${{ env.DOCKER_USERNAME != '' }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: docker build -t ${DOCKER_USERNAME}/moustass-frontend:latest ./frontend

      - name: Push image frontend
        if: ${{ env.DOCKER_USERNAME != '' }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: docker push ${DOCKER_USERNAME}/moustass-frontend:latest